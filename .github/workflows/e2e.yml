name: End-to-end test (emulator)

# Boots an Android emulator plus local Firebase emulators (Auth, Realtime Database
# with this repo's rules, Storage) and walks through the main client and freelancer
# flows. Screenshots and logcat are uploaded as the "e2e-screenshots" artifact.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build emulator-flavoured APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PuseFirebaseEmulator=true
          mkdir -p out && cp app/build/outputs/apk/release/*.apk out/AfroConnect-e2e.apk

      - name: Start Firebase emulators
        run: |
          npm install -g firebase-tools
          cat > firebase.e2e.json <<'JSON'
          {
            "database": { "rules": "database.rules.json" },
            "storage": { "rules": "storage.rules" },
            "emulators": {
              "auth": { "host": "0.0.0.0", "port": 9099 },
              "database": { "host": "0.0.0.0", "port": 9000 },
              "storage": { "host": "0.0.0.0", "port": 9199 },
              "ui": { "enabled": false }
            }
          }
          JSON
          nohup firebase emulators:start --only auth,database,storage --project africonnect-ab9c9 --config firebase.e2e.json > emulators.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s localhost:9099 >/dev/null && curl -s localhost:9000 >/dev/null && break
            sleep 2
          done
          tail -20 emulators.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/e2e.sh

      - name: Upload screenshots & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            shots/
            emulators.log
